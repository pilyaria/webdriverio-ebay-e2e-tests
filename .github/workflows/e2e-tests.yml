name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous Allure results
        run: rm -rf allure-results allure-report

      # --------------------
      # Chrome
      # --------------------

      - name: Chrome - Chai tests
        run: npm run test:chai:chrome

      - name: Chrome - Jewelry tests
        run: npm run test:jewelry:chrome

      - name: Chrome - Search tests
        run: npm run test:search:chrome

      # --------------------
      # Firefox
      # --------------------

      - name: Firefox - Chai tests
        run: npm run test:chai:firefox

      - name: Firefox - Jewelry tests
        run: npm run test:jewelry:firefox

      - name: Firefox - Search tests
        run: npm run test:search:firefox

      # --------------------
      # Allure
      # --------------------

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # --------------------
      # Failure diagnostics
      # --------------------

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # --------------------
      # GitHub Pages
      # --------------------

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy:
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
