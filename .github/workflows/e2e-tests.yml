name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chai
          - jewelry
          - search

      browser:
        description: "Browser"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - chrome
          - firefox

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      # --------------------
      # Setup
      # --------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean previous Allure results
        run: rm -rf allure-results allure-report

      # --------------------
      # Chrome
      # --------------------

      - name: Chrome - Chai tests
        id: chrome_chai
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'chrome') &&
           (inputs.suite == 'all' || inputs.suite == 'chai'))
        continue-on-error: true
        run: npm run test:chai:chrome

      - name: Chrome - Jewelry tests
        id: chrome_jewelry
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'chrome') &&
           (inputs.suite == 'all' || inputs.suite == 'jewelry'))
        continue-on-error: true
        run: npm run test:jewelry:chrome

      - name: Chrome - Search tests
        id: chrome_search
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'chrome') &&
           (inputs.suite == 'all' || inputs.suite == 'search'))
        continue-on-error: true
        run: npm run test:search:chrome

      # --------------------
      # Firefox
      # --------------------

      - name: Firefox - Chai tests
        id: firefox_chai
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'firefox') &&
           (inputs.suite == 'all' || inputs.suite == 'chai'))
        continue-on-error: true
        run: npm run test:chai:firefox

      - name: Firefox - Jewelry tests
        id: firefox_jewelry
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'firefox') &&
           (inputs.suite == 'all' || inputs.suite == 'jewelry'))
        continue-on-error: true
        run: npm run test:jewelry:firefox

      - name: Firefox - Search tests
        id: firefox_search
        if: |
          github.event_name == 'push' ||
          ((inputs.browser == 'both' || inputs.browser == 'firefox') &&
           (inputs.suite == 'all' || inputs.suite == 'search'))
        continue-on-error: true
        run: npm run test:search:firefox

      # --------------------
      # Allure
      # --------------------

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # --------------------
      # Failure diagnostics
      # --------------------

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      # --------------------
      # GitHub Pages
      # --------------------

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      # --------------------
      # Final test status
      # --------------------

      - name: Check test results
        if: always()
        run: |
          echo "Chrome Chai: ${{ steps.chrome_chai.outcome }}"
          echo "Chrome Jewelry: ${{ steps.chrome_jewelry.outcome }}"
          echo "Chrome Search: ${{ steps.chrome_search.outcome }}"
          echo "Firefox Chai: ${{ steps.firefox_chai.outcome }}"
          echo "Firefox Jewelry: ${{ steps.firefox_jewelry.outcome }}"
          echo "Firefox Search: ${{ steps.firefox_search.outcome }}"

          if [[ "${{ steps.chrome_chai.outcome }}" == "failure" ||
                "${{ steps.chrome_jewelry.outcome }}" == "failure" ||
                "${{ steps.chrome_search.outcome }}" == "failure" ||
                "${{ steps.firefox_chai.outcome }}" == "failure" ||
                "${{ steps.firefox_jewelry.outcome }}" == "failure" ||
                "${{ steps.firefox_search.outcome }}" == "failure" ]]; then
            echo "One or more E2E test suites failed."
            exit 1
          fi

          echo "All selected E2E test suites passed."

  # --------------------
  # Deploy Allure
  # --------------------

  deploy:
    if: always()
    needs: e2e-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
